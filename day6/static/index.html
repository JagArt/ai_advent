<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek — агент</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<main class="container">
    <header class="header">
        <div>
            <h1>Агент</h1>
            <div class="params" id="params"></div>
        </div>
        <button type="button" class="copy" id="reset" disabled>Новый диалог</button>
    </header>

    <section class="chat" id="chat" aria-live="polite">
        <p class="placeholder" id="placeholder">Здесь появится диалог</p>
    </section>

    <form class="form" id="form">
        <textarea
            id="prompt"
            class="prompt"
            rows="4"
            placeholder="Введите сообщение&#10;&#10;Enter — отправить, Shift + Enter — новая строка"
            autofocus
        ></textarea>

        <div class="actions">
            <span class="hint" id="status"></span>
            <button type="submit" class="button" id="submit" disabled>Отправить</button>
        </div>
    </form>
</main>

<script src="/static/app.js"></script>
</body>
</html>
