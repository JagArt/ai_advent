<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP — первый инструмент</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<main class="container">
    <header class="header">
        <h1>Первый инструмент MCP</h1>
        <p class="subtitle">Агент вызывает git через MCP и отвечает по результату</p>
    </header>

    <form class="form" id="form">
        <textarea
            id="prompt"
            class="prompt"
            rows="4"
            placeholder="Введите запрос&#10;&#10;Ctrl + Enter — отправить"
            autofocus
        >Кто сделал последний коммит, когда, и какие файлы в нём менялись?</textarea>

        <div class="actions">
            <label class="toggle">
                <input type="checkbox" id="mcp" checked>
                <span>MCP</span>
            </label>
            <span class="hint" id="status"></span>
            <button type="button" class="copy" id="check">Проверить соединение</button>
            <button type="submit" class="button" id="submit">Спросить</button>
        </div>
    </form>

    <section class="panel" id="connection">
        <div class="panel-head">
            <span class="panel-title">Соединение</span>
            <span class="meta" id="connectionMeta"></span>
        </div>
        <div class="panel-body" id="connectionBody">
            <span class="placeholder">MCP включён: соединение поднимется на первом запросе</span>
        </div>
    </section>

    <section class="panel" id="calls" hidden>
        <div class="panel-head">
            <span class="panel-title">Вызовы инструментов</span>
            <span class="meta" id="callsMeta"></span>
        </div>
        <div class="panel-body" id="callsBody"></div>
    </section>

    <section class="result-wrap">
        <div class="result-head">
            <div>
                <span class="result-title">Ответ</span>
                <span class="meta" id="answerMeta"></span>
            </div>
            <button type="button" class="copy" id="copy" hidden>Копировать</button>
        </div>
        <pre class="result" id="answer"><span class="placeholder">Здесь появится ответ модели</span></pre>
    </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
