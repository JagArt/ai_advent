<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek — формат ответа</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<main class="container">
    <header class="header">
        <h1>Формат ответа</h1>
        <p class="subtitle">Один запрос — свободный ответ и ответ с ограничениями</p>
    </header>

    <form class="form" id="form">
        <textarea
            id="prompt"
            class="prompt"
            rows="6"
            placeholder="Введите запрос&#10;&#10;Ctrl + Enter — отправить"
            autofocus
        >Чем полезна утренняя зарядка?</textarea>

        <div class="actions">
            <span class="hint" id="status"></span>
            <button type="submit" class="button" id="submit">Сравнить</button>
        </div>
    </form>

    <section class="compare">
        <article class="result-wrap">
            <div class="result-head">
                <div>
                    <span class="result-title">Без ограничений</span>
                    <span class="meta" id="metaFree"></span>
                </div>
                <button type="button" class="copy" id="copyFree" hidden>Копировать</button>
            </div>
            <pre class="result" id="resultFree"><span class="placeholder">Здесь появится свободный ответ</span></pre>
        </article>
        <article class="result-wrap">
            <div class="result-head">
                <div>
                    <span class="result-title">С ограничениями</span>
                    <span class="meta" id="metaControlled"></span>
                </div>
                <button type="button" class="copy" id="copyControlled" hidden>Копировать</button>
            </div>
            <pre class="result" id="resultControlled"><span class="placeholder">Здесь появится ответ по ограничениям</span></pre>
        </article>
    </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
